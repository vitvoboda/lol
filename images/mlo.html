
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V10 Racing</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#247b36;font-family:Arial;color:white;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:absolute;top:9px;left:9px;background:#001b0c;padding:12px 17px;border-radius:14px;z-index:2;font-weight:bold;line-height:1.7}
#controls{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;z-index:3}
.group{display:flex;gap:12px}
button{width:68px;height:68px;border:2px solid white;border-radius:17px;background:#182c20;color:white;font-size:27px;font-weight:bold;touch-action:none}
button:active{background:#c20}
#screen{position:absolute;inset:0;background:#000c;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:5}
#screen button{width:auto;padding:0 30px;background:#c20}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
🏎️ V10 RACING<br>
Rychlost: <span id="speed">0</span> km/h<br>
Skóre: <span id="score">0</span><br>
Stav: <span id="status">PŘIPRAVEN</span>
</div>

<div id="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="group">
  <button id="brake">▼</button>
  <button id="gas">▲</button>
 </div>
</div>

<div id="screen">
 <h1 id="title">V10 RACING</h1>
 <p id="message">Připrav se na závod!</p>
 <button id="start">START ZÁVODU</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W,H,D;

function resize(){
 D=devicePixelRatio||1;
 W=innerWidth;H=innerHeight;
 canvas.width=W*D;canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

const keys={left:false,right:false,gas:false,brake:false};

function bind(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 for(const ev of ["pointerup","pointercancel","lostpointercapture"])
  b.addEventListener(ev,()=>keys[key]=false);
}
bind("left","left");bind("right","right");
bind("gas","gas");bind("brake","brake");

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key==="ArrowUp"||e.key==="w")keys.gas=true;
 if(e.key==="ArrowDown"||e.key==="s")keys.brake=true;
});
addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
 if(e.key==="ArrowUp"||e.key==="w")keys.gas=false;
 if(e.key==="ArrowDown"||e.key==="s")keys.brake=false;
});

let speed=0,score=0,playerLane=0;
let curve=0,curveTarget=0,roadOffset=0;
let playing=false,crashed=false,cars=[];
let spawnTimer=0,shake=0,lastTime=0;

// HLUBOKÝ A MĚKKÝ ZVUK MOTORU
let audio=null,master=null,engine1=null,engine2=null;
let engineGain=null,subGain=null,engineFilter=null;

function initAudio(){
 if(audio){
  audio.resume();
  return;
 }

 audio=new(window.AudioContext||window.webkitAudioContext)();

 master=audio.createGain();
 master.gain.value=.20;

 // Omezení náhlých hlasitých špiček
 const compressor=audio.createDynamicsCompressor();
 compressor.threshold.value=-28;
 compressor.knee.value=20;
 compressor.ratio.value=5;
 compressor.attack.value=.03;
 compressor.release.value=.3;

 master.connect(compressor);
 compressor.connect(audio.destination);

 engineFilter=audio.createBiquadFilter();
 engineFilter.type="lowpass";
 engineFilter.frequency.value=220;
 engineFilter.Q.value=.5;

 engineGain=audio.createGain();
 engineGain.gain.value=.001;

 engine1=audio.createOscillator();
 engine1.type="triangle";
 engine1.frequency.value=35;
 engine1.connect(engineGain);
 engineGain.connect(engineFilter);
 engineFilter.connect(master);
 engine1.start();

 // Jemný hluboký bas
 engine2=audio.createOscillator();
 engine2.type="sine";
 engine2.frequency.value=22;

 subGain=audio.createGain();
 subGain.gain.value=.08;

 engine2.connect(subGain);
 subGain.connect(master);
 engine2.start();
}

function updateSound(){
 if(!audio||!engine1)return;

 const t=audio.currentTime;
 const rpm=32+speed*.55;

 engine1.frequency.setTargetAtTime(rpm,t,.16);
 engine2.frequency.setTargetAtTime(rpm*.48,t,.18);

 engineFilter.frequency.setTargetAtTime(
  170+speed*1.3+(keys.gas?65:0),t,.2
 );

 engineGain.gain.setTargetAtTime(
  playing?(keys.gas?.055:.025):.001,t,.2
 );

 subGain.gain.setTargetAtTime(
  playing?.055:.001,t,.2
 );
}

// TICHÁ TLUMENÁ BOURAČKA
function crashSound(){
 if(!audio)return;

 const t=audio.currentTime;
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 const filter=audio.createBiquadFilter();

 osc.type="sine";
 osc.frequency.setValueAtTime(75,t);
 osc.frequency.exponentialRampToValueAtTime(32,t+.3);

 filter.type="lowpass";
 filter.frequency.value=130;

 gain.gain.setValueAtTime(.12,t);
 gain.gain.exponentialRampToValueAtTime(.001,t+.35);

 osc.connect(filter);
 filter.connect(gain);
 gain.connect(master);

 osc.start(t);
 osc.stop(t+.4);
}

// SILNICE
function roadCenter(y){
 const p=Math.max(0,Math.min(1,(y-H*.22)/(H*.78)));
 return W/2+curve*Math.pow(p,1.6)*W*.24;
}
function roadHalf(y){
 const p=Math.max(0,Math.min(1,(y-H*.22)/(H*.78)));
 return W*(.065+.36*p);
}

function drawRoad(){
 ctx.fillStyle="#247b36";
 ctx.fillRect(0,0,W,H);

 const top=H*.22;
 ctx.fillStyle="#555";
 ctx.beginPath();
 ctx.moveTo(roadCenter(top)-roadHalf(top),top);
 ctx.lineTo(roadCenter(top)+roadHalf(top),top);
 ctx.lineTo(roadCenter(H)+roadHalf(H),H);
 ctx.lineTo(roadCenter(H)-roadHalf(H),H);
 ctx.closePath();
 ctx.fill();

 ctx.strokeStyle="white";
 ctx.lineWidth=5;

 for(const side of [-1,1]){
  ctx.beginPath();
  ctx.moveTo(roadCenter(top)+side*roadHalf(top),top);
  ctx.lineTo(roadCenter(H)+side*roadHalf(H),H);
  ctx.stroke();
 }

 for(let i=0;i<18;i++){
  const p=((i/18+roadOffset*.0008)%1);
  const y=top+p*(H-top);
  const x=roadCenter(y);
  const size=2+p*7;
  ctx.fillStyle="white";
  ctx.fillRect(x-size/2,y,size,Math.max(3,p*30));
 }
}

// AUTO
function drawCar(x,y,s,color){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(s,s);

 ctx.fillStyle="#111";
 ctx.fillRect(-27,-34,9,23);
 ctx.fillRect(18,-34,9,23);
 ctx.fillRect(-27,20,9,23);
 ctx.fillRect(18,20,9,23);

 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.moveTo(-22,42);
 ctx.lineTo(-27,10);
 ctx.lineTo(-18,-30);
 ctx.lineTo(-11,-43);
 ctx.lineTo(11,-43);
 ctx.lineTo(18,-30);
 ctx.lineTo(27,10);
 ctx.lineTo(22,42);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#162c40";
 ctx.beginPath();
 ctx.moveTo(-16,-19);
 ctx.lineTo(-11,-36);
 ctx.lineTo(11,-36);
 ctx.lineTo(16,-19);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="white";
 ctx.fillRect(-18,31,8,4);
 ctx.fillRect(10,31,8,4);
 ctx.restore();
}

function spawnCar(){
 cars.push({
  p:0,
  lane:(Math.random()-.5)*1.3,
  color:["#ffcc00","#168cff","#ddd","#e21b16","#22aa55"][Math.floor(Math.random()*5)]
 });
}

function crash(reason){
 if(crashed)return;
 crashed=true;
 playing=false;
 speed=0;
 shake=20;
 crashSound();

 document.getElementById("status").textContent="HAVÁRIE";
 document.getElementById("title").textContent="💥 NABOURAL JSI!";
 document.getElementById("message").textContent=
  reason+" Skóre: "+Math.floor(score);
 document.getElementById("start").textContent="RESTART";
 document.getElementById("screen").style.display="flex";
}

function reset(){
 speed=0;score=0;playerLane=0;
 curve=0;curveTarget=0;roadOffset=0;
 cars=[];spawnTimer=60;
 crashed=false;playing=true;

 document.getElementById("status").textContent="ZÁVOD";
 document.getElementById("screen").style.display="none";
}

document.getElementById("start").onclick=()=>{
 initAudio();
 reset();
};

function update(dt){
 if(!playing)return;
 const frame=dt/16.67;

 if(keys.gas)speed+=.22*frame;
 else speed-=.025*frame;
 if(keys.brake)speed-=.4*frame;

 speed=Math.max(0,Math.min(230,speed));

 if(keys.left)playerLane-=.025*frame;
 if(keys.right)playerLane+=.025*frame;

 if(Math.random()<.008*frame)
  curveTarget=(Math.random()-.5)*1.5;

 curve+=(curveTarget-curve)*.008*frame;
 roadOffset+=speed*.2*frame;
 score+=speed*.006*frame;

 spawnTimer-=frame;
 if(spawnTimer<=0){
  spawnCar();
  spawnTimer=Math.max(35,100-speed*.2+Math.random()*35);
 }

 for(const car of cars){
  car.p+=(.003+speed*.000035)*frame;
  const y=H*.22+car.p*(H*.85);
  car.x=roadCenter(y)+car.lane*roadHalf(y)*.72;
  car.y=y;

  const py=H*.80;
  const px=roadCenter(py)+playerLane*roadHalf(py)*.8;

  if(Math.abs(y-py)<65&&Math.abs(car.x-px)<43){
   crash("Narazil jsi do auta!");
   return;
  }
 }
 cars=cars.filter(c=>c.p<1.1);

 if(Math.abs(playerLane)>.88){
  if(speed>35){
   crash("Vyjel jsi ze silnice!");
   return;
  }
  speed=Math.max(0,speed-1*frame);
 }

 updateSound();
}

function draw(){
 ctx.save();

 if(shake>.5){
  ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  shake*=.85;
 }

 drawRoad();

 for(const car of cars){
  drawCar(car.x,car.y,.45+car.p*.7,car.color);
 }

 const py=H*.80;
 const px=roadCenter(py)+playerLane*roadHalf(py)*.8;
 drawCar(px,py,1.12,"#168cff");

 ctx.restore();

 document.getElementById("speed").textContent=Math.round(speed);
 document.getElementById("score").textContent=Math.floor(score);
}

function loop(time){
 const dt=Math.min(time-lastTime||16.67,40);
 lastTime=time;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
