<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cookie CLICKER</title>
    <style>
        /* Definice proměnných pro barvy (výchozí: Světlý režim) */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --button-bg: #007bff;
            --button-text: #ffffff;
            --button-hover: #0056b3;
            --border-color: #e0e0e0;
        }

        /* Proměnné pro Tmavý režim */
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #dad5d5;
            --text-color: #f5f5f5;
            --button-bg: #bb86fc;
            --button-text: #121212;
            --button-hover: #9965df;
            --border-color: #333333;
        }

        /* Základní stylování stránky */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            cursor: pointer; /* Změní kurzor na ruku, aby bylo jasné, že se dá kliknout všude */
        }

        /* Stylování kolonky (karty) */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 350px;
            width: 100%;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            cursor: default; /* Na kartě samotné zůstane normální šipka */
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 2rem;
            user-select: none; /* Zabrání nechtěnému označování textu při rychlém klikání */
        }

        /* Stylování tlačítka */
        .btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn:hover {
            background-color: var(--button-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Stylování počítadla */
        .counter-text {
            font-size: 0.95rem;
            opacity: 0.8;
            margin: 0;
            user-select: none;
        }

        #click-count {
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>cookie CLICKER</h1>
        
        <button id="theme-toggle" class="btn">Přepnout na tmavý režim</button>
        
        <p class="counter-text">Počet přepnutí: <span id="click-count">0</span></p>
    </div>

    <script>
        const toggleButton = document.getElementById('theme-toggle');
        const clickCountSpan = document.getElementById('click-count');
        let clicks = 0;

        // Posluchač je nyní na celém dokumentu (stránce)
        document.addEventListener('click', () => {
            // Zvýšení počítadla
            clicks ++;
            clickCountSpan.textContent = clicks;

            // Zjištění aktuálního režimu a jeho přepnutí
            const currentTheme = document.documentElement.getAttribute('data-theme');
            
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                toggleButton.textContent = 'Přepnout na tmavý režim';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                toggleButton.textContent = 'Přepnout na světlý režim';
            }
        });
    </script>

</body>
</html>
